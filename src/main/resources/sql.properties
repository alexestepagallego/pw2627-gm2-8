# ==========================================
# 1. CONSULTAS DE TRABAJADOR
# ==========================================
select-findAllTrabajadores=SELECT id, nombre, apellidos, dni, fecha_nacimiento, direccion, fecha_alta, categoria, num_colegiado FROM trabajador;
select-findTrabajadorById=SELECT id, nombre, apellidos, dni, fecha_nacimiento, direccion, fecha_alta, categoria, num_colegiado FROM trabajador WHERE id = ?;
select-findTrabajadorByDni=SELECT id, nombre, apellidos, dni, fecha_nacimiento, direccion, fecha_alta, categoria, num_colegiado FROM trabajador WHERE dni = ?;
select-findTrabajadoresByCategoria=SELECT id, nombre, apellidos, dni, fecha_nacimiento, direccion, fecha_alta, categoria, num_colegiado FROM trabajador WHERE categoria = ? ORDER BY fecha_alta DESC;
insert-addTrabajador=INSERT INTO trabajador (nombre, apellidos, dni, fecha_nacimiento, direccion, fecha_alta, categoria, num_colegiado) VALUES (?, ?, ?, ?, ?, ?, ?, ?);
update-updateTrabajador=UPDATE trabajador SET nombre = ?, apellidos = ?, dni = ?, fecha_nacimiento = ?, direccion = ?, fecha_alta = ?, categoria = ?, num_colegiado = ? WHERE id = ?;
delete-deleteTrabajador=DELETE FROM trabajador WHERE id = ?;

# ==========================================
# 2. CONSULTAS DE RECINTO
# ==========================================
select-findAllRecintos=SELECT id, nombre, ubicacion, capacidad_maxima, tipo_animal FROM recinto;
select-findRecintoById=SELECT id, nombre, ubicacion, capacidad_maxima, tipo_animal FROM recinto WHERE id = ?;
select-findRecintoByNombre=SELECT id, nombre, ubicacion, capacidad_maxima, tipo_animal FROM recinto WHERE nombre = ?;
insert-addRecinto=INSERT INTO recinto (nombre, ubicacion, capacidad_maxima, tipo_animal) VALUES (?, ?, ?, ?);
update-updateRecinto=UPDATE recinto SET nombre = ?, ubicacion = ?, capacidad_maxima = ?, tipo_animal = ? WHERE id = ?;
delete-deleteRecinto=DELETE FROM recinto WHERE id = ?;

# ==========================================
# 3. CONSULTAS DE ANIMAL (Sin relaciones)
# ==========================================
select-findAllAnimales=SELECT codigo_registro, especie, raza, nombre, edad, estado_salud, fecha_llegada, fecha_fallecimiento FROM animal;
select-findAnimalByCodigo=SELECT codigo_registro, especie, raza, nombre, edad, estado_salud, fecha_llegada, fecha_fallecimiento FROM animal WHERE codigo_registro = ?;
select-findAnimalesByEspecie=SELECT codigo_registro, especie, raza, nombre, edad, estado_salud, fecha_llegada, fecha_fallecimiento FROM animal WHERE especie = ?;
insert-addAnimal=INSERT INTO animal (codigo_registro, especie, raza, nombre, edad, estado_salud, fecha_llegada, fecha_fallecimiento) VALUES (?, ?, ?, ?, ?, ?, ?, ?);
update-updateAnimal=UPDATE animal SET especie = ?, raza = ?, nombre = ?, edad = ?, estado_salud = ?, fecha_llegada = ?, fecha_fallecimiento = ? WHERE codigo_registro = ?;
delete-deleteAnimal=DELETE FROM animal WHERE codigo_registro = ?;

